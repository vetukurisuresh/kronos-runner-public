name: Cloud Nifty Forecast (16 GB runner)

# Real NIFTY 50 / BANK NIFTY inference. Batched Monte Carlo keeps a cycle under
# a minute; the result is written to Firebase and uploaded as a JSON artifact.

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Base-model Monte Carlo draws (one batched pass)
        required: false
        default: "6"
        type: string
      replay_evals:
        description: Walk-forward replay checkpoints (mini model)
        required: false
        default: "6"
        type: string
      live_loop:
        description: Keep streaming to Firebase during market hours
        required: false
        default: false
        type: boolean
      interval_sec:
        description: Seconds between live cycles
        required: false
        default: "300"
        type: string

permissions:
  contents: write

concurrency:
  group: kronos-nifty-forecast
  cancel-in-progress: false

jobs:
  forecast:
    name: Real Nifty + BankNifty forecast
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}

    steps:
      - name: Checkout runner workspace
        uses: actions/checkout@v4

      - name: Report runner capacity
        run: |
          echo "vCPU: $(nproc)"
          free -h

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Cache HuggingFace model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            model/weights
          key: kronos-trio-${{ runner.os }}-v1
          restore-keys: |
            kronos-trio-${{ runner.os }}-

      - name: Install CPU PyTorch and deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cloud.txt

      - name: Download the KRONOS trio
        run: python -m model.download_all_kronos --target model/weights

      - name: Run real-market forecast
        env:
          KRONOS_LIVE_LOOP: ${{ github.event.inputs.live_loop }}
        run: |
          FLAGS="--samples ${{ github.event.inputs.samples }} --replay-evals ${{ github.event.inputs.replay_evals }}"
          if [ "${{ github.event.inputs.live_loop }}" = "true" ]; then
            FLAGS="$FLAGS --live-loop --interval-sec ${{ github.event.inputs.interval_sec }}"
          fi
          python -u scripts/cloud_nifty_forecast.py $FLAGS

      - name: Ensure public read rules for the dashboard
        env:
          FIREBASE_APPLY_RULES: "1"
        run: python state/firebase_sync.py || echo "firebase rules step skipped"

      - name: Report artifact size
        run: |
          ls -lh state/ || true
          python -c "import json;d=json.load(open('state/nifty_kronos_state.json'));print('symbols:',list(d['symbols']));print('elapsed:',d['elapsed_seconds'],'s');print('firebase:',d.get('firebase',{}).get('ok'));print('replay:',d['replay_summary'])"

      - name: Publish state snapshot for the Pages mirror
        run: |
          cp state/nifty_kronos_state.json dashboard/static/latest_cloud_state.json
          git config user.name "kronos-runner"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/static/latest_cloud_state.json
          git commit -m "Update cloud state snapshot" || echo "state unchanged"
          git push origin HEAD:main || echo "push skipped"

      - name: Upload forecast state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-kronos-state
          path: state/nifty_kronos_state.json
          retention-days: 14
          if-no-files-found: warn
