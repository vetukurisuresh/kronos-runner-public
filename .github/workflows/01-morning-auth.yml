name: 01 Morning Upstox Auth (08:25 IST)

# 08:25 IST = 02:55 UTC.  The `29 2` spelling in the request is 07:59 IST, not
# 08:25; this is the corrected cron.  Scheduled workflows can be delayed by
# GitHub, so the edge job independently verifies the token before streaming.
on:
  schedule:
    - cron: "55 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kronos-morning-auth
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"
  UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
  UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
  UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
  UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
  UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
  UPSTOX_MOBILE_REDIRECT_URI: ${{ vars.UPSTOX_MOBILE_REDIRECT_URI }}
  FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
  FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
  SECRET_PAT: ${{ secrets.SECRET_PAT }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  mint:
    name: Headless token mint + Firebase publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install auth-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyotp playwright pynacl google-auth google-auth-httplib2 protobuf python-dotenv

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Mint with 3 retries
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "auth attempt ${attempt}/3"
            if python scripts/auto_upstox_morning_login.py --require --push-secret; then
              exit 0
            fi
            sleep 20
          done
          echo "Upstox auth failed after 3 attempts" >&2
          exit 1

      - name: Verify live profile
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from market.upstox_health import load_access_token, verify_token
          token = load_access_token()
          if not token:
              raise SystemExit("no token after mint")
          probe = verify_token(token)
          print(f"profile HTTP {probe.get('status')} ok={probe.get('ok')}")
          raise SystemExit(0 if probe.get("ok") else 1)
          PY

      - name: Show safe readiness
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("state/autopilot_readiness.json")
          if p.is_file():
              data = json.loads(p.read_text())
              print({k: data.get(k) for k in ("status", "auth_minted", "auth_verified", "minted_at_ist")})
          else:
              print("readiness file not written")
          PY

      - name: Upload auth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-morning-auth-${{ github.run_id }}
          path: |
            state/autopilot_readiness.json
            state/logs/
          if-no-files-found: ignore
          retention-days: 7
