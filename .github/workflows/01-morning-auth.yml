name: "01 - Ghost morning auth (08:30 IST)"

# Zero-touch token mint before the open. The Playwright login is skipped
# cleanly when the credential secrets are absent, so the phone fallback stays
# usable. The token is published to Firebase before the live-edge shift starts.

on:
  schedule:
    - cron: "0 3 * * 1-5"   # 08:30 IST, Monday-Friday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kronos-morning-auth
  cancel-in-progress: false

jobs:
  ghost-login:
    name: Headless Upstox login + token
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kolkata
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
      UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
      UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
      UPSTOX_MOBILE_REDIRECT_URI: ${{ vars.UPSTOX_MOBILE_REDIRECT_URI }}
      UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
      UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
      UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
      SECRET_PAT: ${{ secrets.SECRET_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright, pyotp and Firebase deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests google-auth pynacl pyotp playwright
          python -m playwright install --with-deps chromium

      - name: Mint today's token headlessly
        run: python scripts/auto_upstox_morning_login.py --push-secret

      - name: Upload the login screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-debug-${{ github.run_id }}
          path: state/logs/upstox_login_*.png
          if-no-files-found: ignore
          retention-days: 7
