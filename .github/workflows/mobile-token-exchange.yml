name: Mobile Upstox token exchange

# The phone opens the Upstox dialog and comes back to the Pages URL with ?code=.
# The page PUTs that one-time code to Firebase; this job (every 5 minutes before
# the open) exchanges it with the API secret that never leaves the runner.

on:
  schedule:
    - cron: "*/5 2-4 * * 1-5"   # 07:30-10:00 IST, weekdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-token-exchange
  cancel-in-progress: false

jobs:
  exchange:
    name: Exchange pending mobile code
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
      UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
      UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
      UPSTOX_MOBILE_REDIRECT_URI: ${{ vars.UPSTOX_MOBILE_REDIRECT_URI }}
      SECRET_PAT: ${{ secrets.SECRET_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: python -m pip install --upgrade pip requests google-auth pynacl

      - name: Exchange the pending code
        run: python scripts/mobile_token_exchange.py --push-secret
