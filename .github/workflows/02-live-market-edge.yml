name: "02 - Live market edge (08:45 IST)"

# Starts the Upstox V3 socket, SSE server and an ephemeral Cloudflare tunnel
# before the 09:15 open. Two shifts stay under the ~6 h job cap: 08:45 and the
# 12:45 handoff. The token is read from Firebase first (freshly minted at 08:30)
# and the repository secret is the fallback.

on:
  schedule:
    - cron: "15 3 * * 1-5"   # 08:45 IST
    - cron: "15 7 * * 1-5"   # 12:45 IST second shift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kronos-live-edge
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata
  FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
  FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
  UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}

jobs:
  edge:
    name: SSE + Cloudflare tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the streaming-only deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests websocket-client protobuf google-auth

      - name: Install cloudflared (quick tunnel client)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$HOME/.local/bin/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$HOME/.local/bin/cloudflared"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cloudflared" --version

      - name: Hydrate today's token from Firebase
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              from state.firebase_sync import admin, rt_get
              url, token = admin()
              record = rt_get(url, token, "/upstox_auth/token.json") or {}
          except Exception as exc:  # noqa: BLE001 - secret fallback below
              print(f"Firebase token unavailable ({type(exc).__name__}); using repository secret")
              raise SystemExit(0)

          access = str(record.get("access_token") or "").strip()
          if not access:
              print("Firebase has no token yet; using repository secret")
              raise SystemExit(0)

          print(f"::add-mask::{access}", flush=True)
          Path("state/upstox_token.json").write_text(json.dumps(record), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"UPSTOX_ACCESS_TOKEN={access}\n")
          print(f"hydrated token ({len(access)} chars, expires {record.get('expires_at')})")
          PY

      - name: Token sanity
        run: |
          if [ -z "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "::error::UPSTOX_ACCESS_TOKEN is empty - run the 01 morning auth first."
            exit 1
          fi
          echo "token present (${#UPSTOX_ACCESS_TOKEN} chars)"

      - name: Start the cloud edge bridge
        run: |
          mkdir -p state/logs
          nohup python -u scripts/upstox_live_session.py --minutes 240 --edge \
            > state/logs/edge_session.log 2>&1 &
          echo $! > state/logs/edge_session.pid
          sleep 15
          tail -40 state/logs/edge_session.log
          curl -fsS http://127.0.0.1:8080/api/ping && echo

      - name: Keep the shift alive
        run: |
          pid=$(cat state/logs/edge_session.pid)
          while kill -0 "$pid" 2>/dev/null; do sleep 30; done
          echo "session exited"
          tail -60 state/logs/edge_session.log

      - name: Upload edge logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-edge-logs-${{ github.run_id }}
          path: |
            state/logs/edge_session.log
            state/logs/edge_server.log
            state/logs/edge_tunnel.log
          if-no-files-found: ignore
          retention-days: 7
