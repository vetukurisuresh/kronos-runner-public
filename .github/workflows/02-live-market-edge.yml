name: 02 Live Market Edge (public bridge)

# Runs the PRIVATE kronos-trading-brain code on this PUBLIC repo's runner.
# Public-repo Actions minutes are free/unlimited; the private repo now holds
# zero schedules so its 2000-minute quota is never touched again.
# Source code is fetched at runtime with a PAT and is never committed here.

on:
  schedule:
    - cron: "02 3 * * 1-5"    # 08:32 IST shift 1
    - cron: "35 3 * * 1-5"    # 09:05 IST backup
    - cron: "46 3 * * 1-5"    # 09:16 IST backup
    - cron: "05 7 * * 1-5"    # 12:35 IST shift 2 handoff
  workflow_dispatch:
    inputs:
      shift:
        description: "Relay shift"
        required: true
        default: "shift-1"
        type: choice
        options: [shift-1, shift-2]
      dry_run:
        description: "Validate dependencies without streaming"
        required: false
        default: false
        type: boolean

permissions:
  contents: read


concurrency:
  # Separate groups per shift so shift 2 can overlap shift 1 (zero-gap relay).
  group: kronos-public-edge-${{ github.event.schedule || github.event.inputs.shift || 'manual' }}
  cancel-in-progress: true

jobs:
  live-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout Private Brain Repo
        uses: actions/checkout@v4
        with:
          repository: vetukurisuresh/kronos-trading-brain
          token: ${{ secrets.SECRET_PAT }}
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f brain/requirements.txt ]; then pip install -r brain/requirements.txt; fi

      - name: Verify private checkout
        run: |
          test -f brain/scripts/upstox_live_session.py || { echo "private checkout missing entrypoint"; exit 1; }
          echo "private brain checkout OK: $(git -C brain rev-parse --short HEAD)"

      - name: Run Live Edge
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          KRONOS_RUNNER: public-bridge
          PYTHONUNBUFFERED: "1"
        run: |
          cd brain
          python scripts/upstox_live_session.py
