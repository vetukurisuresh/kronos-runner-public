name: KRONOS Live Edge Stream (cloud SSE -> Cloudflare -> phone)

# The laptop is no longer part of the path: this job runs the Upstox V3 socket,
# the SSE server and an ephemeral Cloudflare quick tunnel on the 16 GB runner,
# then publishes the public URL to Firebase for the Pages terminal.
#
# Two shifts keep the 09:15-15:30 IST session covered under the ~6h job cap.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 1-5"   # 09:10 IST
    - cron: "15 7 * * 1-5"   # 12:45 IST (second shift, overlaps by design)

permissions:
  contents: read

concurrency:
  group: kronos-live-edge
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata
  FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
  FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
  UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}

jobs:
  edge:
    name: Runner-hosted SSE + tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the streaming-only deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests websocket-client protobuf google-auth

      - name: Install cloudflared (quick tunnel client)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$HOME/.local/bin/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$HOME/.local/bin/cloudflared"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cloudflared" --version

      - name: Token sanity
        run: |
          if [ -z "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "::error::UPSTOX_ACCESS_TOKEN is empty - run the morning login first."
            exit 1
          fi
          echo "token present (${#UPSTOX_ACCESS_TOKEN} chars)"

      - name: Start the cloud edge bridge
        run: |
          mkdir -p state/logs
          nohup python -u scripts/upstox_live_session.py --minutes 200 --edge \
            > state/logs/edge_session.log 2>&1 &
          echo $! > state/logs/edge_session.pid
          sleep 15
          tail -40 state/logs/edge_session.log
          curl -fsS http://127.0.0.1:8080/api/ping && echo

      - name: Keep the shift alive
        run: |
          pid=$(cat state/logs/edge_session.pid)
          while kill -0 "$pid" 2>/dev/null; do sleep 30; done
          echo "session exited"
          tail -60 state/logs/edge_session.log

      - name: Upload edge logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-edge-logs-${{ github.run_id }}
          path: |
            state/logs/edge_session.log
            state/logs/edge_server.log
            state/logs/edge_tunnel.log
          if-no-files-found: ignore
          retention-days: 7
