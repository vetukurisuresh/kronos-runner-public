name: Morning Upstox auto-login (08:50 IST)

# Zero-touch alternative to tapping the phone: only runs when UPSTOX_MOBILE,
# UPSTOX_PIN and UPSTOX_TOTP_SECRET are present as repository secrets.
# The script exits 0 without doing anything when they are missing.

on:
  schedule:
    - cron: "20 3 * * 1-5"   # 08:50 IST, weekdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-upstox-login
  cancel-in-progress: false

jobs:
  login:
    name: Mint the daily token headlessly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
      UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
      UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
      UPSTOX_MOBILE_REDIRECT_URI: ${{ vars.UPSTOX_MOBILE_REDIRECT_URI }}
      UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
      UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
      UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
      SECRET_PAT: ${{ secrets.SECRET_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip requests google-auth pynacl pyotp playwright
          python -m playwright install --with-deps chromium

      - name: Auto-login (skips cleanly when secrets are absent)
        run: python scripts/auto_upstox_morning_login.py --push-secret

      - name: Keep a screenshot for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-debug
          path: state/logs/upstox_login_*.png
          if-no-files-found: ignore
          retention-days: 7
