name: Build Mobile APK (Flet)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Flet build mode
        required: false
        default: apk
        type: choice
        options:
          - apk
          - aab
  push:
    branches:
      - main
    paths:
      - "mobile_app/**"
      - ".github/workflows/build_mobile_apk.yml"

permissions:
  contents: read

concurrency:
  group: build-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Flet Android build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.1.2"

      - name: Preflight - mobile entrypoint
        run: |
          test -f mobile_app/main_apk.py || {
            echo "::error::mobile_app/main_apk.py is missing"; exit 1; }

      - name: Build ${{ github.event.inputs.build_mode || 'apk' }}
        working-directory: mobile_app
        run: |
          flet build "${{ github.event.inputs.build_mode || 'apk' }}" --verbose --yes --module-name main_apk.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronos-mobile-${{ github.event.inputs.build_mode || 'apk' }}
          path: |
            mobile_app/build/apk/*.apk
            mobile_app/build/aab/*.aab
          if-no-files-found: error
          retention-days: 14
