name: Deploy dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p site
          cp -r dashboard/static/. site/
          # Firebase URL is public metadata, not a secret.
          DB_URL="${{ vars.FIREBASE_DB_URL }}"
          [ -z "$DB_URL" ] && DB_URL="https://kronos-nifty-desk-default-rtdb.asia-southeast1.firebasedatabase.app"
          CLIENT_ID="${{ vars.UPSTOX_CLIENT_ID }}"
          MOBILE_REDIRECT="${{ vars.UPSTOX_MOBILE_REDIRECT_URI }}"
          [ -z "$MOBILE_REDIRECT" ] && MOBILE_REDIRECT="https://vetukurisuresh.github.io/kronos-runner-public/"
          printf 'window.KRONOS_CONFIG = { firebaseDbUrl: "%s", upstoxClientId: "%s", upstoxRedirectUri: "%s" };\n' \
            "$DB_URL" "$CLIENT_ID" "$MOBILE_REDIRECT" > site/config.js
          ls -la site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
